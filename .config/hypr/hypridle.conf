general {
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 600                            # in seconds
    on-resume = hyprctl dispatch dpms on DP-1; hyprctl dispatch dpms on DP-2 # command to run when timeout has passed
    on-timeout = hyprctl dispatch dpms off DP-1; hyprctl dispatch dpms off DP-2 # command to run when timeout has passed
}
